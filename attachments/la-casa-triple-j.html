<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>La Casa Triple J — Montrose</title>
<style>
  :root{
    --gold:#D4AF37;
    --gold-dim:#9c7d2c;
    --velvet:#0d0d0f;
    --bg:#020203;
    --cyan:#00f5d4;
    --warm:#FFA834;
    --panel:rgba(18,16,14,0.62);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);overflow:hidden;
    font-family:'Helvetica Neue',Arial,sans-serif;}
  #scene-canvas{position:fixed;inset:0;display:block;touch-action:none;
    filter:contrast(1.15) saturate(1.06);}

  /* ---------- vignette + grade overlays (fake post-processing) ---------- */
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 42%, rgba(0,0,0,0.6) 100%);
    opacity:0.55;transition:opacity 1.1s ease;
  }
  #vignette.deep{opacity:0.82;}
  .glow-blob{position:fixed;pointer-events:none;z-index:4;border-radius:50%;
    filter:blur(26px);mix-blend-mode:screen;opacity:0.85;transition:transform .08s linear;}
  #glow-neon{width:140px;height:220px;background:radial-gradient(ellipse, rgba(0,245,212,.55), rgba(0,245,212,0) 70%);}
  #glow-shrine{width:260px;height:260px;background:radial-gradient(ellipse, rgba(255,244,212,.4), rgba(255,244,212,0) 70%);}

  /* ---------- loading veil ---------- */
  #veil{position:fixed;inset:0;z-index:50;background:#020203;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:14px;transition:opacity 1s ease;}
  #veil .mark{font-family:Georgia,'Times New Roman',serif;color:var(--gold);font-size:15px;
    letter-spacing:0.35em;text-transform:uppercase;opacity:0.85;}
  #veil .bar{width:160px;height:1px;background:rgba(212,175,55,0.25);position:relative;overflow:hidden;}
  #veil .bar::after{content:'';position:absolute;left:-40%;top:0;height:100%;width:40%;
    background:var(--gold);animation:sweep 1.4s ease-in-out infinite;}
  @keyframes sweep{0%{left:-40%;}100%{left:100%;}}

  /* ---------- top nav ---------- */
  #nav{position:fixed;top:max(16px,env(safe-area-inset-top));right:14px;z-index:20;
    display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:78vw;}
  .pill{
    background:var(--panel);border:1px solid rgba(212,175,55,0.55);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    color:#eee6cf;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;
    padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;
    transition:background .25s, border-color .25s, transform .15s;user-select:none;
  }
  .pill:active{transform:scale(0.95);}
  .pill.active{border-color:var(--gold);background:rgba(212,175,55,0.16);}
  #cart-pill{border-color:var(--cyan);color:#d7fff8;}

  /* ---------- bottom carousel ---------- */
  #carousel{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));
    z-index:20;display:flex;justify-content:center;pointer-events:none;}
  #carousel-track{display:flex;gap:10px;padding:8px 10px;pointer-events:auto;
    background:var(--panel);border:1px solid rgba(212,175,55,0.35);border-radius:999px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:92vw;overflow-x:auto;}
  .thumb{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-family:Georgia,serif;font-size:14px;color:#eee6cf;cursor:pointer;
    border:1px solid rgba(212,175,55,0.4);background:radial-gradient(circle at 35% 30%, #2a2620, #0d0c0a);
    transition:transform .15s, border-color .2s;}
  .thumb.on{border-color:var(--gold);transform:translateY(-3px);}

  /* ---------- product tooltip / inspect card ---------- */
  #tooltip{position:fixed;z-index:22;transform:translate(-50%,-100%);pointer-events:none;
    display:none;transition:opacity .2s;}
  #tooltip .card{pointer-events:auto;background:var(--panel);border:1px solid rgba(212,175,55,0.6);
    border-radius:10px;padding:10px 12px;min-width:168px;backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,0.5);}
  #tooltip .name{font-family:Georgia,serif;color:#f4ecd8;font-size:13.5px;margin:0 0 2px;}
  #tooltip .price{color:var(--gold);font-size:12px;letter-spacing:0.05em;margin:0 0 8px;}
  #tooltip .row{display:flex;gap:6px;}
  #tooltip button{flex:1;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;
    padding:7px 6px;border-radius:6px;border:1px solid rgba(212,175,55,0.5);
    background:rgba(212,175,55,0.08);color:#eee6cf;cursor:pointer;}
  #tooltip button.primary{background:var(--gold);color:#141208;border-color:var(--gold);font-weight:600;}
  #tooltip .arrow{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%) rotate(45deg);
    width:11px;height:11px;background:rgba(18,16,14,0.9);border-right:1px solid rgba(212,175,55,0.6);
    border-bottom:1px solid rgba(212,175,55,0.6);}

  /* ---------- back-to-store ---------- */
  #back-btn{position:fixed;left:14px;top:max(16px,env(safe-area-inset-top));z-index:20;
    display:none;background:var(--panel);border:1px solid rgba(212,175,55,0.55);color:#eee6cf;
    padding:9px 14px;border-radius:999px;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
    backdrop-filter:blur(10px);cursor:pointer;}

  #hint{position:fixed;bottom:78px;left:0;right:0;text-align:center;z-index:19;color:rgba(238,230,207,0.55);
    font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;pointer-events:none;transition:opacity 1s;}
</style>
</head>
<body>

<canvas id="scene-canvas"></canvas>
<div id="vignette"></div>
<div id="glow-neon" class="glow-blob"></div>
<div id="glow-shrine" class="glow-blob"></div>

<div id="veil"><div class="mark">La Casa Triple J</div><div class="bar"></div></div>

<div id="nav">
  <div class="pill active" data-cam="default">Collections</div>
  <div class="pill" data-cam="hats">Hat Shop</div>
  <div class="pill" data-cam="collabs">Streetwear Collabs</div>
  <div class="pill" id="cart-pill">Cart (0)</div>
</div>

<button id="back-btn">&larr; Back to store</button>
<div id="hint">Drag to look around · Tap a piece to inspect</div>

<div id="tooltip">
  <div class="card">
    <p class="name" id="tt-name">—</p>
    <p class="price" id="tt-price">—</p>
    <div class="row">
      <button id="tt-inspect">Inspect</button>
      <button class="primary" id="tt-cart">Add to cart</button>
    </div>
    <div class="arrow"></div>
  </div>
</div>

<div id="carousel"><div id="carousel-track"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   LA CASA TRIPLE J — MONTROSE
   A boutique storefront scene: shrine altar, hat island,
   streetwear-collab island, velvet curtains and a Miami
   street glimpse. Built on plain Three.js r128 (no bundler
   available), with CSS standing in for the bloom / vignette /
   colour-grade stage of the requested post-processing chain.
   ============================================================ */

var canvas = document.getElementById('scene-canvas');
var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

var scene = new THREE.Scene();
scene.background = makeNightGradient();
scene.fog = new THREE.FogExp2(0x020203, 0.045);

var camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
var ORBIT_CENTER = new THREE.Vector3(0, 1.2, 0);
camera.position.set(0, 1.4, 4.5);
camera.lookAt(ORBIT_CENTER);

/* ---------------- procedural texture helpers ---------------- */
function makeCanvas(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

function makeNightGradient(){
  var c = makeCanvas(8,512);
  var ctx = c.getContext('2d');
  var g = ctx.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#050507'); g.addColorStop(0.55,'#0a0a0d'); g.addColorStop(1,'#050506');
  ctx.fillStyle = g; ctx.fillRect(0,0,8,512);
  var tex = new THREE.CanvasTexture(c);
  return tex;
}

function makeMarbleTexture(){
  var c = makeCanvas(1024,1024), ctx = c.getContext('2d');
  ctx.fillStyle = '#0b0b0c'; ctx.fillRect(0,0,1024,1024);
  for (var i=0;i<26;i++){
    ctx.strokeStyle = 'rgba(220,220,225,' + (0.04+Math.random()*0.10) + ')';
    ctx.lineWidth = 0.6 + Math.random()*2.2;
    ctx.beginPath();
    var x = Math.random()*1024, y = 0;
    ctx.moveTo(x,y);
    for (var s=0;s<6;s++){
      x += (Math.random()-0.5)*260;
      y += 1024/6;
      ctx.bezierCurveTo(x+80,y-90,x-80,y-30,x,y);
    }
    ctx.stroke();
  }
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2,2);
  return tex;
}

function makeSignTexture(opts){
  var w = opts.w||1024, h = opts.h||512;
  var c = makeCanvas(w,h), ctx = c.getContext('2d');
  ctx.clearRect(0,0,w,h);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = '700 ' + opts.mainSize + 'px Georgia, "Times New Roman", serif';
  var grad = ctx.createLinearGradient(0,h*0.28,0,h*0.55);
  grad.addColorStop(0, '#f6e6a8'); grad.addColorStop(0.5, opts.color||'#D4AF37'); grad.addColorStop(1,'#8a6a1e');
  ctx.fillStyle = grad;
  ctx.shadowColor = opts.color||'#D4AF37';
  ctx.shadowBlur = opts.glow!=null?opts.glow:24;
  ctx.fillText(opts.main, w/2, h*0.40);

  if (opts.sub){
    ctx.font = '400 ' + opts.subSize + 'px Helvetica, Arial, sans-serif';
    ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(238,230,207,0.85)';
    var spaced = opts.sub.split('').join(String.fromCharCode(8202)+String.fromCharCode(8202));
    ctx.fillText(spaced, w/2, h*0.62);
  }
  if (opts.script){
    ctx.font = 'italic 400 ' + opts.scriptSize + 'px Georgia, serif';
    ctx.shadowBlur = 6;
    ctx.fillStyle = 'rgba(212,175,55,0.9)';
    ctx.fillText(opts.script, w/2, h*0.80);
  }
  var tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

function makeHaloTexture(){
  var w=1024,h=1024,c=makeCanvas(w,h),ctx=c.getContext('2d');
  var cx=w/2, cy=h*0.46;
  var g = ctx.createRadialGradient(cx,cy,10,cx,cy,460);
  g.addColorStop(0,'rgba(255,244,212,0.95)');
  g.addColorStop(0.35,'rgba(255,220,150,0.35)');
  g.addColorStop(1,'rgba(255,220,150,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = 'rgba(212,175,55,0.55)';
  for (var r=90; r<420; r+=44){
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  }
  var rays = 24;
  for (var i=0;i<rays;i++){
    var a = (i/rays)*Math.PI*2;
    ctx.strokeStyle = 'rgba(255,236,180,' + (0.10+0.10*(i%2)) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a)*40, cy + Math.sin(a)*40);
    ctx.lineTo(cx + Math.cos(a)*470, cy + Math.sin(a)*470);
    ctx.stroke();
  }
  var tex = new THREE.CanvasTexture(c);
  return tex;
}

function makeFabricTexture(base, weave){
  var c = makeCanvas(256,256), ctx = c.getContext('2d');
  ctx.fillStyle = base; ctx.fillRect(0,0,256,256);
  ctx.fillStyle = weave;
  for (var y=0;y<256;y+=3){ ctx.fillRect(0,y,256,1); }
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(2,2);
  return tex;
}

/* ---------------------- lighting -------------------------- */
scene.add(new THREE.AmbientLight(0x33405a, 0.55));
var hemi = new THREE.HemisphereLight(0x22283a, 0x090807, 0.35);
scene.add(hemi);

var keyLight = new THREE.SpotLight(0xfff4d4, 3.2, 12, Math.PI/7, 0.45, 1.2);
keyLight.position.set(0, 4.4, -0.6);
keyLight.target.position.set(0, 0.9, -1.7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024,1024);
scene.add(keyLight, keyLight.target);

var neonLight = new THREE.PointLight(0x00f5d4, 2.2, 9, 2);
neonLight.position.set(-4.6, 2.0, -0.6);
scene.add(neonLight);

var sconceLight = new THREE.PointLight(0xffa834, 1.6, 6, 2);
sconceLight.position.set(3.1, 2.3, -0.5);
scene.add(sconceLight);

var fillLight = new THREE.PointLight(0x8fa3ff, 0.35, 10);
fillLight.position.set(0, 3, 3);
scene.add(fillLight);

/* ---------------------- materials --------------------------- */
var GOLD = new THREE.MeshStandardMaterial({color:0xD4AF37, metalness:0.9, roughness:0.28});
var GOLD_BRIGHT = new THREE.MeshStandardMaterial({color:0xE8C766, metalness:0.85, roughness:0.2, emissive:0x3a2c08, emissiveIntensity:0.3});
var GLASS = new THREE.MeshPhysicalMaterial({
  color:0x9fb3b0, metalness:0, roughness:0.05, transmission:0.92, thickness:0.4,
  transparent:true, opacity:0.35, ior:1.45, clearcoat:1, clearcoatRoughness:0.1
});
var MARBLE_FLOOR = new THREE.MeshStandardMaterial({map:makeMarbleTexture(), roughness:0.14, metalness:0.35});
var MARBLE_PLINTH = new THREE.MeshStandardMaterial({color:0x121213, roughness:0.2, metalness:0.25});
var VELVET = new THREE.MeshStandardMaterial({map:makeFabricTexture('#0c0b0e','rgba(0,0,0,0.18)'), roughness:0.95, metalness:0.05});
var ASPHALT = new THREE.MeshStandardMaterial({color:0x0c0d10, roughness:0.35, metalness:0.15});

/* ---------------------- floor & backdrop ---------------------- */
var floor = new THREE.Mesh(new THREE.PlaneGeometry(16,12), MARBLE_FLOOR);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

var backWall = new THREE.Mesh(new THREE.PlaneGeometry(11,6), new THREE.MeshStandardMaterial({color:0x08080a, roughness:0.9}));
backWall.position.set(0,3,-2.6);
scene.add(backWall);

/* ---------------------- facade signage ---------------------- */
var facadeGroup = new THREE.Group();
facadeGroup.position.set(0,2.8,-1.5);
var signTex = makeSignTexture({
  main:'LA CASA TRIPLE J', mainSize:96, color:'#D4AF37',
  sub:'MONTROSE', subSize:34,
  script:'Dios sobre todo', scriptSize:40
});
var signPlane = new THREE.Mesh(new THREE.PlaneGeometry(4.6,2.3),
  new THREE.MeshBasicMaterial({map:signTex, transparent:true}));
facadeGroup.add(signPlane);
var signShadow = signPlane.clone();
signShadow.material = new THREE.MeshBasicMaterial({map:signTex, transparent:true, opacity:0.25, color:0x000000});
signShadow.position.z = -0.03; signShadow.position.y = -0.02;
facadeGroup.add(signShadow);
scene.add(facadeGroup);

/* ---------------------- shrine (center altar) ---------------------- */
var shrine = new THREE.Group();
shrine.position.set(0,0,-1.8);
scene.add(shrine);

var archOuter = new THREE.Mesh(
  new THREE.TorusGeometry(1.05, 0.09, 12, 32, Math.PI),
  GOLD
);
archOuter.position.set(0,1.55,0.35);
archOuter.rotation.z = Math.PI;
shrine.add(archOuter);

[-1.05,1.05].forEach(function(x){
  var pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.13,1.55,16), GOLD);
  pillar.position.set(x,0.78,0.35);
  pillar.castShadow = true;
  shrine.add(pillar);
});

var niche = new THREE.Mesh(new THREE.CylinderGeometry(0.98,0.98,1.7,32,1,true,0,Math.PI),
  new THREE.MeshStandardMaterial({color:0x050506, roughness:0.9, side:THREE.BackSide}));
niche.position.set(0,0.85,0.1);
niche.rotation.y = Math.PI/2;
shrine.add(niche);

var halo = new THREE.Mesh(new THREE.PlaneGeometry(2.1,2.1),
  new THREE.MeshBasicMaterial({map:makeHaloTexture(), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false}));
halo.position.set(0,1.35,-0.55);
shrine.add(halo);

var statue = new THREE.Group();
var statueBody = new THREE.Mesh(new THREE.ConeGeometry(0.28,0.85,20), GOLD_BRIGHT);
statueBody.position.y = 0.42; statueBody.castShadow = true;
var statueHead = new THREE.Mesh(new THREE.SphereGeometry(0.15,20,20), GOLD_BRIGHT);
statueHead.position.y = 0.95;
var statueHalo = new THREE.Mesh(new THREE.TorusGeometry(0.2,0.02,8,24), GOLD);
statueHalo.position.y = 1.02; statueHalo.rotation.x = Math.PI/2.3;
var statueBase = new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.4,0.16,20), MARBLE_PLINTH);
statueBase.position.y = 0.05;
statue.add(statueBody, statueHead, statueHalo, statueBase);
statue.position.set(0,0.05,-0.3);
shrine.add(statue);

var candle1 = makeCandle(); candle1.position.set(-0.55,0,0.35); shrine.add(candle1);
var candle2 = makeCandle(); candle2.position.set(0.55,0,0.35); shrine.add(candle2);
function makeCandle(){
  var g = new THREE.Group();
  var stand = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.07,0.5,10), GOLD);
  stand.position.y = 0.25;
  var flame = new THREE.Mesh(new THREE.ConeGeometry(0.03,0.09,8),
    new THREE.MeshBasicMaterial({color:0xffdca0}));
  flame.position.y = 0.55;
  var flameLight = new THREE.PointLight(0xffb35c, 0.5, 1.4);
  flameLight.position.y = 0.55;
  g.add(stand, flame, flameLight);
  return g;
}

/* ---------------------- display islands ---------------------- */
function buildIsland(xSign, rotY){
  var island = new THREE.Group();
  island.position.set(xSign*2.2, 0, 0.5);
  island.rotation.y = rotY;

  var base = new THREE.Mesh(new THREE.BoxGeometry(1.7,0.75,0.95), MARBLE_PLINTH);
  base.position.y = 0.375; base.castShadow = true; base.receiveShadow = true;
  island.add(base);

  var vitrine = new THREE.Mesh(new THREE.BoxGeometry(1.65,0.85,0.85), GLASS);
  vitrine.position.y = 1.17;
  island.add(vitrine);

  var frameMat = GOLD;
  var edges = new THREE.LineSegments(new THREE.EdgesGeometry(vitrine.geometry),
    new THREE.LineBasicMaterial({color:0xD4AF37}));
  edges.position.copy(vitrine.position);
  island.add(edges);

  var ledStrip = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.02,0.02),
    new THREE.MeshBasicMaterial({color:0xFFE8A3}));
  ledStrip.position.set(0,1.58,0.41);
  island.add(ledStrip);

  var glassFront = new THREE.Mesh(new THREE.PlaneGeometry(1.55,0.8), GLASS.clone());
  glassFront.position.set(0,1.17,0.43);
  island.add(glassFront);

  return {group:island, glassFront:glassFront, top:1.6};
}
var leftIsland = buildIsland(-1, 0.25);
var rightIsland = buildIsland(1, -0.25);
scene.add(leftIsland.group, rightIsland.group);

/* ---------------------- product prop builders ---------------------- */
function makeCap(color){
  var g = new THREE.Group();
  var crown = new THREE.Mesh(new THREE.SphereGeometry(0.16,20,14,0,Math.PI*2,0,Math.PI/1.7),
    new THREE.MeshStandardMaterial({color:color, roughness:0.85, metalness:0.05}));
  var brim = new THREE.Mesh(new THREE.CylinderGeometry(0.19,0.19,0.012,24,1,false,0,Math.PI),
    new THREE.MeshStandardMaterial({color:color, roughness:0.7, metalness:0.05}));
  brim.rotation.x = Math.PI/2; brim.position.set(0,-0.02,0.13);
  var button = new THREE.Mesh(new THREE.SphereGeometry(0.015,8,8), GOLD);
  button.position.y = 0.155;
  g.add(crown, brim, button);
  g.rotation.x = -0.15;
  return g;
}
function makeSneaker(color){
  var g = new THREE.Group();
  var sole = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.05,0.13),
    new THREE.MeshStandardMaterial({color:0xf2f2ef, roughness:0.6}));
  var body = new THREE.Mesh(new THREE.SphereGeometry(0.11,16,12),
    new THREE.MeshStandardMaterial({color:color, roughness:0.5, metalness:0.1}));
  body.scale.set(1.7,0.85,0.95); body.position.set(-0.02,0.075,0);
  var camoPatch = new THREE.Mesh(new THREE.BoxGeometry(0.16,0.06,0.09),
    new THREE.MeshStandardMaterial({color:0x4a5a34, roughness:0.65}));
  camoPatch.position.set(0.02,0.11,0.05);
  g.add(sole, body, camoPatch);
  return g;
}
function makeBag(color){
  var g = new THREE.Group();
  var body = new THREE.Mesh(new THREE.BoxGeometry(0.24,0.19,0.09),
    new THREE.MeshStandardMaterial({color:color, roughness:0.55, metalness:0.15}));
  body.position.y = 0.1;
  var handle = new THREE.Mesh(new THREE.TorusGeometry(0.09,0.012,8,16,Math.PI),
    GOLD);
  handle.position.set(0,0.23,0); handle.rotation.z = Math.PI;
  var clasp = new THREE.Mesh(new THREE.BoxGeometry(0.03,0.02,0.02), GOLD);
  clasp.position.set(0,0.19,0.05);
  g.add(body, handle, clasp);
  return g;
}

/* ---------------------- product registry ---------------------- */
var PRODUCTS = [];
function addProduct(cfg){
  var mesh = cfg.build(cfg.color);
  mesh.traverse(function(o){ if(o.isMesh){ o.castShadow = true; } });
  mesh.position.set(cfg.x, cfg.y, cfg.z);
  mesh.scale.setScalar(cfg.scale||1);
  cfg.parent.add(mesh);
  var uplight = new THREE.SpotLight(0xffffff, 2.6, 3.2, Math.PI/9, 0.5, 1.4);
  uplight.position.set(cfg.x, cfg.y+0.9, cfg.z+0.05);
  uplight.target = mesh;
  cfg.parent.add(uplight, uplight.target);
  var rec = {
    id:cfg.id, name:cfg.name, price:cfg.price, mesh:mesh, uplight:uplight,
    baseIntensity:2.6, island:cfg.island, baseY:cfg.y, phase:Math.random()*Math.PI*2,
    baseScale:cfg.scale||1
  };
  PRODUCTS.push(rec);
}

/* ---------------------- curtains ---------------------- */
function makeCurtain(x, rotY){
  var geo = new THREE.PlaneGeometry(1.5, 2.0, 12, 20);
  var pos = geo.attributes.position;
  for (var i=0;i<pos.count;i++){
    var vx = pos.getX(i), vy = pos.getY(i);
    var fold = Math.sin(vx*6.5)*0.05 + Math.sin(vx*2.1+1)*0.03;
    pos.setZ(i, fold*(0.4+0.6*((vy+1)/2)));
  }
  geo.computeVertexNormals();
  geo.translate(0,-1.0,0);
  var mesh = new THREE.Mesh(geo, VELVET);
  mesh.position.set(x, 2.0, 0);
  mesh.rotation.y = rotY;
  mesh.receiveShadow = true;
  return mesh;
}

scene.add(makeCurtain(3.5, -0.32));

/* ============================================================
   camera rig: clamped horizontal/vertical orbit with damping,
   plus a free "inspect" mode for the click-to-zoom transition
   ============================================================ */
var RADIUS = camera.position.distanceTo(ORBIT_CENTER);
var azimuth = 0, targetAzimuth = 0;
var polar = Math.acos((camera.position.y-ORBIT_CENTER.y)/RADIUS), targetPolar = polar;
var AZ_MIN=-0.35, AZ_MAX=0.35, POL_MIN=Math.PI/2.4, POL_MAX=Math.PI/1.9;
var DAMPING = 0.06;

var inspecting = false, inspectTargetPos = new THREE.Vector3(), inspectLookAt = new THREE.Vector3();
var freeLookAt = ORBIT_CENTER.clone();

function updateCamera(){
  if (!inspecting){
    azimuth += (targetAzimuth-azimuth)*DAMPING;
    polar += (targetPolar-polar)*DAMPING;
    camera.position.x = ORBIT_CENTER.x + RADIUS*Math.sin(polar)*Math.sin(azimuth);
    camera.position.y = ORBIT_CENTER.y + RADIUS*Math.cos(polar);
    camera.position.z = ORBIT_CENTER.z + RADIUS*Math.sin(polar)*Math.cos(azimuth);
    freeLookAt.lerp(ORBIT_CENTER, 0.08);
    camera.lookAt(freeLookAt);
  } else {
    camera.position.lerp(inspectTargetPos, 0.07);
    freeLookAt.lerp(inspectLookAt, 0.09);
    camera.lookAt(freeLookAt);
  }
}

function panTo(azTarget, polTarget){
  inspecting = false;
  targetAzimuth = azTarget; targetPolar = polTarget;
}
function inspectProduct(rec){
  inspecting = true;
  var wp = new THREE.Vector3();
  rec.mesh.getWorldPosition(wp);
  inspectTargetPos.set(wp.x, wp.y+0.1, wp.z+0.8);
  inspectLookAt.copy(wp);
  setVignetteDeep(true);
  slideGlass(rec.island, true);
}
function exitInspect(){
  inspecting = false;
  setVignetteDeep(false);
  slideGlass('hats', false);
  slideGlass('collabs', false);
}
function slideGlass(island, open){
  var target = island==='hats' ? leftIsland.glassFront : rightIsland.glassFront;
  target.userData.slideOpen = open;
}

/* ---------------------- pointer / orbit / tap logic ---------------------- */
var raycaster = new THREE.Raycaster();
var pointerNDC = new THREE.Vector2();
var isDown=false, downX=0, downY=0, lastX=0, lastY=0, moved=false;
var selected = null;

function toNDC(x,y){ pointerNDC.set((x/window.innerWidth)*2-1, -(y/window.innerHeight)*2+1); }

canvas.addEventListener('pointerdown', function(e){
  isDown = true; moved = false;
  downX = lastX = e.clientX; downY = lastY = e.clientY;
});
window.addEventListener('pointermove', function(e){
  if (!isDown) return;
  var dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (Math.abs(e.clientX-downX)>6 || Math.abs(e.clientY-downY)>6) moved = true;
  if (moved && !inspecting){
    targetAzimuth = Math.max(AZ_MIN, Math.min(AZ_MAX, targetAzimuth + dx*0.0028));
    targetPolar = Math.max(POL_MIN, Math.min(POL_MAX, targetPolar - dy*0.0028));
    document.getElementById('nav').querySelectorAll('.pill').forEach(function(p){p.classList.remove('active');});
  }
});
window.addEventListener('pointerup', function(e){
  if (!isDown) return; isDown = false;
  if (!moved){ handleTap(e.clientX, e.clientY); }
});

function handleTap(x,y){
  toNDC(x,y);
  raycaster.setFromCamera(pointerNDC, camera);
  var meshes = PRODUCTS.map(function(p){return p.mesh;});
  var hits = raycaster.intersectObjects(meshes, true);
  if (hits.length){
    var hitMesh = hits[0].object;
    while (hitMesh.parent && PRODUCTS.indexOf(findRec(hitMesh))===-1){ hitMesh = hitMesh.parent; }
    var rec = findRec(hitMesh);
    if (rec){ selectProduct(rec); return; }
  }
  hideTooltip();
}
function findRec(mesh){
  for (var i=0;i<PRODUCTS.length;i++){ if (PRODUCTS[i].mesh===mesh) return PRODUCTS[i]; }
  return null;
}

function selectProduct(rec){
  selected = rec;
  showTooltip(rec);
  highlightCarousel(rec.id);
}

/* ---------------------- tooltip UI ---------------------- */
var tooltip = document.getElementById('tooltip');
var ttName = document.getElementById('tt-name');
var ttPrice = document.getElementById('tt-price');
var ttInspect = document.getElementById('tt-inspect');
var ttCart = document.getElementById('tt-cart');
var backBtn = document.getElementById('back-btn');
var hintEl = document.getElementById('hint');
var cartCount = 0;
var cartPill = document.getElementById('cart-pill');

function showTooltip(rec){
  ttName.textContent = rec.name;
  ttPrice.textContent = '$' + rec.price.toLocaleString();
  tooltip.style.display = 'block';
  tooltip.style.opacity = '1';
  positionTooltip(rec);
}
function hideTooltip(){
  tooltip.style.opacity = '0';
  setTimeout(function(){ if(tooltip.style.opacity==='0') tooltip.style.display='none'; },200);
  selected = null;
}
function positionTooltip(rec){
  var wp = new THREE.Vector3(); rec.mesh.getWorldPosition(wp);
  wp.y += 0.32;
  var p = wp.clone().project(camera);
  var x = (p.x*0.5+0.5)*window.innerWidth;
  var y = (1-(p.y*0.5+0.5))*window.innerHeight;
  tooltip.style.left = x+'px';
  tooltip.style.top = y+'px';
}

ttInspect.addEventListener('click', function(){
  if (selected){ inspectProduct(selected); backBtn.style.display='block'; hideTooltip(); }
});
ttCart.addEventListener('click', function(){
  cartCount++; cartPill.textContent = 'Cart ('+cartCount+')';
  ttCart.textContent = 'Added ✓';
  setTimeout(function(){ ttCart.textContent='Add to cart'; },900);
});
backBtn.addEventListener('click', function(){
  exitInspect(); backBtn.style.display='none';
});

function setVignetteDeep(on){
  document.getElementById('vignette').classList.toggle('deep', on);
}

/* ---------------------- top nav + carousel ---------------------- */
document.querySelectorAll('#nav .pill[data-cam]').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('#nav .pill').forEach(function(p){p.classList.remove('active');});
    btn.classList.add('active');
    exitInspect(); backBtn.style.display='none'; hideTooltip();
    var cam = btn.getAttribute('data-cam');
    if (cam==='default') panTo(0, Math.acos(0.2/RADIUS));
    if (cam==='hats') panTo(AZ_MIN*0.85, POL_MIN*1.02);
    if (cam==='collabs') panTo(AZ_MAX*0.85, POL_MIN*1.02);
  });
});

var track = document.getElementById('carousel-track');
PRODUCTS.forEach(function(rec){
  var t = document.createElement('div');
  t.className = 'thumb';
  t.textContent = rec.name.split(' ').map(function(w){return w[0];}).join('').slice(0,2);
  t.title = rec.name;
  t.addEventListener('click', function(){
    selectProduct(rec);
    inspectProduct(rec);
    backBtn.style.display='block';
    highlightCarousel(rec.id);
  });
  track.appendChild(t);
  rec.thumbEl = t;
});
function highlightCarousel(id){
  PRODUCTS.forEach(function(r){ r.thumbEl.classList.toggle('on', r.id===id); });
}

/* ---------------------- glow blobs follow key features ---------------------- */
var glowNeon = document.getElementById('glow-neon');
var glowShrine = document.getElementById('glow-shrine');
var neonWorld = new THREE.Vector3();
var shrineWorld = new THREE.Vector3(0,1.6,-1.45);

function updateGlows(){
  neonSign.getWorldPosition(neonWorld);
  projectToCSS(neonWorld, glowNeon);
  projectToCSS(shrineWorld, glowShrine);
}
function projectToCSS(worldPos, el){
  var p = worldPos.clone().project(camera);
  if (p.z>1){ el.style.opacity='0'; return; }
  var x = (p.x*0.5+0.5)*window.innerWidth;
  var y = (1-(p.y*0.5+0.5))*window.innerHeight;
  el.style.opacity = '0.85';
  el.style.transform = 'translate(' + (x-parseFloat(el.style.width||el.offsetWidth)/2) + 'px,' + (y-parseFloat(el.style.height||el.offsetHeight)/2) + 'px)';
}

/* ---------------------- resize ---------------------- */
window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------------- animation loop ---------------------- */
var clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  var t = clock.getElapsedTime();

  PRODUCTS.forEach(function(rec){
    var isSel = selected===rec || (inspecting && inspectLookAt.distanceToSquared((function(){var w=new THREE.Vector3();rec.mesh.getWorldPosition(w);return w;})())<0.0001);
    var bob = Math.sin(t*1.5+rec.phase)*0.03;
    rec.mesh.position.y = rec.baseY + bob;
    rec.mesh.rotation.y += 0.005;
    var targetScale = (selected===rec) ? rec.baseScale*1.08 : rec.baseScale;
    rec.mesh.scale.setScalar(THREE.MathUtils.lerp(rec.mesh.scale.x, targetScale, 0.12));
    var targetI = (selected===rec) ? rec.baseIntensity*1.3 : rec.baseIntensity;
    rec.uplight.intensity = THREE.MathUtils.lerp(rec.uplight.intensity, targetI, 0.12);
  });

  [leftIsland, rightIsland].forEach(function(isl){
    var open = isl.glassFront.userData.slideOpen;
    var targetX = open ? 0.55 : 0;
    isl.glassFront.position.x = THREE.MathUtils.lerp(isl.glassFront.position.x, targetX, 0.08);
  });

  neonLight.intensity = 2.0 + Math.sin(t*3.2)*0.15;

  updateCamera();
  if (selected) positionTooltip(selected);
  updateGlows();

  renderer.render(scene, camera);
}
animate();
